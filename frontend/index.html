<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería de Imágenes - Lab S3</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .upload-box { margin-bottom: 20px; padding: 15px; border: 2px dashed #ccc; text-align: center; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center; background: #fff; }
    .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 3px; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; margin-top: 10px; cursor: pointer; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Galería de Imágenes en Amazon S3</h1>
    <div class="upload-box">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
      <button id="uploadBtn">Subir Imagen</button>
      <p id="status" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
    <h2>Galería</h2>
    <div id="gallery" class="gallery"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
